<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 { font-size: 2.5rem; }
    h2 { color: #58a6ff; }

    .section { margin-bottom: 40px; }

    .card {
      background: #161b22;
      padding: 20px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .tag {
      display: inline-block;
      border: 1px solid #30363d;
      padding: 5px 10px;
      margin: 5px 5px 0 0;
      border-radius: 20px;
      font-size: 0.9rem;
    }

    .button {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 15px;
      border: 1px solid #58a6ff;
      border-radius: 6px;
      text-decoration: none;
      color: #58a6ff;
    }

    .muted {
      color: #8b949e;
      font-size: 0.95rem;
    }
	
	details summary {
	cursor: pointer;
	font-weight: bold;
	margin-bottom: 10px;
}
	
  </style>
</head>

<body>
  <div class="container">

    <!-- HERO -->
    <div class="section">
      <h1 id="name"></h1>
      <h3 id="role"></h3>
      <p id="description" class="muted"></p>
      <a id="cvButton" class="button"></a>
    </div>

    <!-- QUE HAGO -->
    <div class="section">
      <h2>Habilidades técnicas</h2>
      <div class="card">
        <ul id="whatIDo"></ul>
      </div>
    </div>

    <!-- SKILLS -->
    <div class="section">
      <h2>⚙️ Stack</h2>
      <div class="grid" id="skills"></div>
    </div>

    <!-- CERTS -->
    <div class="section">
      <h2>Cursos y Certificaciones</h2>
      <div id="certs"></div>
    </div>

    <!-- COMO TRABAJO -->
    <div class="section">
      <h2>🚀 Cómo trabajo</h2>
      <div class="card">
        <ul id="workflow"></ul>
      </div>
    </div>

    <!-- CONTACTO -->
    <div class="section">
      <h2>📫 Contacto</h2>
      <div class="card" id="contact"></div>
    </div>

  </div>

  <script>
    // 🔥 CONFIGURACIÓN (EDITAS SOLO ESTO)
    const profile = {
      name: "Victor",
      role: "Especialista Ciberseguridad",
      description: "Enfocado en protección de aplicaciones web, análisis de tráfico y gestión de seguridad en capa 7. Con experiencia práctica operando plataformas WAF/WAAP y Anti-DDoS. Enfocado en la protección de aplicaciones web, entornos cloud y servicios empresariales mediante hardening, respuesta a incidentes y mitigación proactiva de amenazas.",

      cv: {
        label: "Solicitar CV",
        link: "#",
		visible: false
      },

      whatIDo: [
        "Seguridad: WAF/WAAP, Anti-DDoS, Respuesta a Incidentes, Monitoreo de Amenazas",	
		"Plataformas WAF: Imperva, Radware, Azure WAF",
        "Seguridad de Aplicaciones: OWASP Top 10 Risks, WAF Tuning, Security Headers, CSP",
        "Cloud: Azure, Entornos Cloud",
        "Infraestructura: Linux, Windows Server, Active Directory, Office 365, Citrix",
		"Redes: TCP/IP, DNS, VPN, Proxy",
		"Herramientas: SSH, RDP, WHM/cPanel, Kali Linux, Nmap, Wireshark"],

      skills: {
        "Seguridad": ["WAF (Imperva)", "Capa 7", "OWASP"],
        "Monitoreo": ["SIEM", "Logs"],
        "Base técnica": ["HTTP/HTTPS", "Networking"]
      },

      certifications: [
        {
          category: "Imperva",
		  items: ["Cloud Based Application Security and Delivery (SLE) - 2023", "Imperva Cloud Application Security Workshop - Overview (SLE) - 2023", "IU_Cloud Web Security Administration Instructor-Led - 2023"]
        },
		{
          category: "Radware",
		  items: ["Cloud Native Protection (CNP) - 2022", "Cloud WAF - 2023","Bot Manager - 2023","DefensePro-X Level 1 & 2 Training - 2024","DefensePro-X Level 1 Certificartion (RCSS) - 2024","Entrenamiento de Cloud WAF en Español - 2024","Data Center - Course Completion - 2025","Cloud WAF Certification - 2025","Cloud WAF Trainig - 2025","Cyber Controller Plus Training - 2025"]
        },		
      ],

      workflow: [
        "Analizo tráfico y patrones sospechosos",
        "Identifico falsos positivos",
        "Ajusto reglas sin afectar el negocio",
        "Monitoreo impacto de cambios"
		
      ],

      contact: {
        linkedin: "#",
        email: "Disponible bajo solicitud"
      }
    };


    // 🧠 RENDER

    document.getElementById("name").textContent = profile.name;
    document.getElementById("role").textContent = profile.role;
    document.getElementById("description").textContent = profile.description;

    const btn = document.getElementById("cvButton");
    btn.textContent = profile.cv.label;
    btn.href = profile.cv.link;
	
	if (!profile.cv.visible) {
  btn.style.display = "none";
}

    // Qué hago
    const whatList = document.getElementById("whatIDo");
    profile.whatIDo.forEach(item => {
      const li = document.createElement("li");
      li.textContent = item;
      whatList.appendChild(li);
    });

    // Skills
    const skillsContainer = document.getElementById("skills");
    for (let category in profile.skills) {
      const div = document.createElement("div");
      div.className = "card";

      const title = document.createElement("strong");
      title.textContent = category;

      div.appendChild(title);
      div.appendChild(document.createElement("br"));

      profile.skills[category].forEach(skill => {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = skill;
        div.appendChild(span);
      });

      skillsContainer.appendChild(div);
    }

    // Certificaciones
    const certsContainer = document.getElementById("certs");
	profile.certifications.forEach(cert => {
		const details = document.createElement("details");
		details.className = "card";

		const summary = document.createElement("summary");
		summary.textContent = cert.category;

		const ul = document.createElement("ul");

		cert.items.forEach(item => {
			const li = document.createElement("li");
			li.textContent = item;
			ul.appendChild(li);
  });

  details.appendChild(summary);
  details.appendChild(ul);
  certsContainer.appendChild(details);
});

    // Workflow
    const workflowList = document.getElementById("workflow");
    profile.workflow.forEach(step => {
      const li = document.createElement("li");
      li.textContent = step;
      workflowList.appendChild(li);
    });

    // Contacto
    const contactDiv = document.getElementById("contact");
    contactDiv.innerHTML = `
      <p><a href="${profile.contact.linkedin}">LinkedIn</a></p>
      <p class="muted">${profile.contact.email}</p>
    `;
  </script>

</body>
</html>
